<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <!--
      No static <title> or <meta name="description"> here on purpose: every
      page renders its own via React 19's native <title>/<meta> hoisting
      (see src/pages/*.tsx). React only dedupes tags it rendered itself, not
      ones already in the static HTML, so a static title here would win over
      every page's dynamic one (the first <title> in the document wins) and
      never update. Home.tsx sets the description; a plain-text fallback isn't
      needed since JS-driven title/meta swap in well before first paint.
    -->
    <!--
      GitHub Pages SPA clean-URL fallback (spa-github-pages pattern):
      404.html re-encodes the requested deep link into a query string and redirects
      here; this script decodes it back into a real path via history.replaceState
      before React Router ever sees the URL, so a hard refresh on /horizon/clocks
      lands on the clocks route instead of GitHub's default 404 page.
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) +
              decoded.shift() +
              (decoded.length ? '?' + decoded.join('&') : '') +
              l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
